    WebhookEnvelopeTrainingModuleCompletedPayload:
      description: The CloudEvents envelope wrapping every webhook event
      properties:
        data:
          $ref: '#/components/schemas/WebhookEnvelopeDataTrainingModuleCompletedPayload'
