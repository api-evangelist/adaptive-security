components:
  schemas:
    SecurityEventLink:
      description: A link found in the email message body.
      properties:
        display_text:
          type: string
          description: Anchor text shown to the recipient. Absent for links without display text.
          example: Verify your billing account
        source:
          type: string
          description: Where the link was found in the email.
          enum:
          - EMAIL_BODY
          - PDF_ATTACHMENT
          example: EMAIL_BODY
        type:
          type: string
          description: The type of link.
          enum:
          - HYPERLINK
          - PLAIN_TEXT
          - QR_CODE
          example: HYPERLINK
        url:
          type: string
          description: Target URL.
          example: https://billing-verify.example.net/login
    SecurityEventReason:
      description: One reason for the email message's classification.
      properties:
        detail:
          type: string
          description: Full explanation of the reason.
          example: The billing verification link leads to a domain unrelated to the sender.
        evidence:
          type: array
          description: Evidence supporting this reason.
          example:
          - label: Link target
            value: https://billing-verify.example.net/login
          items:
            $ref: '#/components/schemas/SecurityEventEvidence'
        headline:
          type: string
          description: Short summary of the reason.
          example: Credential-harvesting link
    WebhookEnvelopeTrainingEnrollmentCreatedPayload:
      description: The CloudEvents envelope wrapping every webhook event
      properties:
        data:
          $ref: '#/components/schemas/WebhookEnvelopeDataTrainingEnrollmentCreatedPayload'
        datacontenttype:
          type: string
          description: media type of `data`
          example: application/json
        id:
          type: string
          description: unique id for event
          example: 9b2f6c1e-8d3a-4f0b-a1c2-5e7d9f3b6a48
        source:
          type: string
          description: the event source; always `/adaptive`
          example: /adaptive
        specversion:
          type: string
          description: CloudEvents spec version
          example: '1.0'
        subject:
          type: string
          description: reserved for the event's primary entity id; currently never set, so always omitted
        time:
          type: string
          format: date-time
          description: when the event occurred
          example: '2026-06-09T18:00:00Z'
        type:
          type: string
          const: training.enrollment.created
          description: the event type
          example: training.enrollment.created
    SecurityEventExplanation:
      description: Why the email message was classified the way it was.
      properties:
        reasons:
          type: array
          description: Individual reasons behind the classification.
          example:
          - detail: The billing verification link leads to a domain unrelated to the sender.
            evidence:
            - label: Link target
              value: https://billing-verify.example.net/login
            headline: Credential-harvesting link
          items:
            $ref: '#/components/schemas/SecurityEventReason'
        summary:
          type: string
          description: Summary of the detection.
          example: A fraudulent billing notice asks the recipient to sign in on a domain unrelated to the vendor.
    WebhookEnvelopeAiGovernancePolicyAcceptedPayload:
      description: The CloudEvents envelope wrapping every webhook event
      properties:
        data:
          $ref: '#/components/schemas/WebhookEnvelopeDataAiGovernancePolicyAcceptedPayload'
        datacontenttype:
          type: string
          description: media type of `data`
          example: application/json
        id:
          type: string
          description: unique id for event
          example: 9b2f6c1e-8d3a-4f0b-a1c2-5e7d9f3b6a48
        source:
          type: string
          description: the event source; always `/adaptive`
          example: /adaptive
        specversion:
          type: string
          description: CloudEvents spec version
          example: '1.0'
        subject:
          type: string
          description: reserved for the event's primary entity id; currently never set, so always omitted
        time:
          type: string
          format: date-time
          description: when the event occurred
          example: '2026-06-09T18:00:00Z'
        type:
          type: string
          const: ai_governance.policy.accepted
          description: the event type
          example: ai_governance.policy.accepted
    Scenario:
      description: The phishing scenario (template) the user was exposed to.
      properties:
        channel:
          type: string
          description: The channel the phishing message was delivered through. Uses the same vocabulary as the Public API's phishing scenario channel.
          enum:
          - EMAIL
          - TEXT
          - INBOUND_PHONE_CALL
          example: EMAIL
        id:
          type: string
          description: Unique identifier of the phishing scenario the user was sent.
          example: b7e6d5c4-3a2b-4c1d-8e9f-0a1b2c3d4e5f
        name:
          type: string
          description: Human-readable name of the scenario (the specific phishing template used).
          example: Password Expiration Notice
    SecurityEventMessage:
      description: The email message behind the security event.
      properties:
        all_recipients:
          type: array
          description: Every addressed recipient, including To, Cc and Bcc.
          example:
          - jordan.lee@example.com
          - finance@example.com
          items:
            type: string
        attachments:
          type: array
          description: Attachments recorded during scanning. Empty for denylist events or when none were persisted.
          example:
          - content_type: application/pdf
            file_extension: pdf
            name: invoice.pdf
            scan_result: SAFE
            sha256: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
            size_bytes: 24576
          items:
            $ref: '#/components/schemas/SecurityEventAttachment'
        headers:
          type: array
          description: Security-relevant headers in their original order. Repeated headers remain separate entries.
          example:
          - name: Received
            value: from mail.vendor.example.com (mail.vendor.example.com [203.0.113.50])
          items:
            $ref: '#/components/schemas/SecurityEventHeader'
        links:
          type: array
          description: Links found in the message body. Empty when none are available.
          example:
          - display_text: Verify your billing account
            source: EMAIL_BODY
            type: HYPERLINK
            url: https://billing-verify.example.net/login
          items:
            $ref: '#/components/schemas/SecurityEventLink'
        message_timestamp:
          type: string
          format: date-time
          description: When the provider received the message (ISO-8601). Absent when unavailable.
          example: '2026-09-15T22:15:25Z'
        recipient:
          type: string
          description: Mailbox of the primary copy that created this event.
          example: jordan.lee@example.com
        rfc_2392_message_id:
          type: string
          description: RFC 2392 Message-ID. Absent when unavailable.
          example: <CAF1x2y3z4@mail.vendor.example.com>
        sender:
          type: string
          description: Sender address.
          example: billing@vendor.example.com
        subject:
          type: string
          description: Message subject. Absent when unavailable.
          example: 'Action required: verify your billing account'
