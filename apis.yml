aid: adaptive-security
name: Adaptive Security
description: >-
  Adaptive Security is the human security platform for the AI era, defending
  organizations against AI-powered social engineering — deepfakes, voice
  cloning, phishing, smishing and vishing — through interactive security
  awareness training, hyperrealistic multi-channel attack simulations, cloud
  email security, and AI governance. Founded by Brian Long and Andrew Jones and
  backed by Andreessen Horowitz (a16z) and the OpenAI Startup Fund, Adaptive
  protects 1,000+ enterprise customers including PayPal, Figma, Ramp, Plaid and
  the NHL. The Adaptive API is a read-only REST reporting interface (v2) that
  gives programmatic access to users, groups, training campaigns, phishing
  campaigns and simulations, and audit logs for compliance reporting, progress
  monitoring, and BI/HRIS/SIEM data integration.
